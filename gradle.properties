org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Kotlin/Native links the iOS framework in a separate JVM. Keep its heap
# independent from the Gradle daemon so Release framework/archive builds do
# not fail during StaticInitializersOptimization with "Java heap space".
kotlin.native.jvmArgs=-Xmx6g
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false
android.useAndroidX=true
android.nonTransitiveRClass=true
