org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Kotlin 2.4 runs Kotlin/Native in the Gradle process by default, where this
# dedicated heap setting is not applied. Force a one-shot compiler process so
# iOS framework linking has an independent heap for the remaining Release
# optimizations; composeApp also disables the pathological static-initializer
# phase only for iOS Release frameworks.
kotlin.native.disableCompilerDaemon=true
kotlin.native.jvmArgs=-Xmx6g
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false
android.useAndroidX=true
android.nonTransitiveRClass=true
