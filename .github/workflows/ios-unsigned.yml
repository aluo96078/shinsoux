name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode
        shell: bash
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Archive without signing
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode \
            -Pkotlin.native.enableKlibsCrossCompilation=false
          xcodebuild archive \
            -project iosApp/Shinsou.xcodeproj \
            -scheme Shinsou \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Shinsou.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO

      - name: Package unsigned IPA
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Shinsou.xcarchive/Products/Applications/Shinsou.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          version="${RELEASE_VERSION#v}"
          /usr/bin/ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" \
            "Shinsou-X-${version}-ios-unsigned.ipa"
          unzip -l "Shinsou-X-${version}-ios-unsigned.ipa" | grep -E 'Payload/Shinsou.app(/|$)'

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shinsou-X-${{ github.ref_name }}-ios-unsigned
          path: Shinsou-X-${{ github.ref_name }}-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
