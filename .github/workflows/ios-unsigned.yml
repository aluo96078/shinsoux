# Manual rebuild of the unsigned IPA for an existing tag. Tag pushes build and publish it through
# release.yml, which attaches it to the GitHub Release.
name: iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Source tag to build (for example v1.0.1)"
        required: true
        default: "v1.0.1"
        type: string

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_TAG:-$EVENT_REF}"
          [[ "$ref" == v* ]] || { echo "release_tag must be a v* tag" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: Select newest Xcode
        shell: bash
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install iOS sandbox toolchain
        shell: bash
        run: brew install llvm lld wasi-libc wasi-runtimes wabt

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Archive without signing
        shell: bash
        env:
          # The Xcode build phase runs Gradle; this names the version the app shows.
          SHINSOU_RELEASE_DISPLAY_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iosApp/Shinsou.xcodeproj \
            -scheme Shinsou \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Shinsou.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO

      - name: Package unsigned IPA
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Shinsou.xcarchive/Products/Applications/Shinsou.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          version="${RELEASE_VERSION#v}"
          /usr/bin/ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" \
            "Shinsou-X-${version}-ios-unsigned.ipa"
          unzip -l "Shinsou-X-${version}-ios-unsigned.ipa" | grep -E 'Payload/Shinsou.app(/|$)'

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shinsou-X-${{ steps.source.outputs.version }}-ios-unsigned
          path: Shinsou-X-${{ steps.source.outputs.version }}-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
