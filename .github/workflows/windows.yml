name: Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and compile (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      # Plugin fixtures are verified byte-for-byte; keep LF line endings on checkout.
      - name: Disable Git line ending conversion
        run: git config --global core.autocrlf false

      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          path: shinsoux
          persist-credentials: false

      - name: Check out official plugin fixtures
        uses: actions/checkout@v4
        with:
          repository: aluo96078/shinsou_plugin
          ref: 0bbc4d7f2f571010ea2acec17de0ea90be144399
          path: shinsou_plugin
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run desktop tests
        id: desktop_tests
        continue-on-error: true
        working-directory: shinsoux
        run: .\gradlew.bat :composeApp:desktopTest '-PshinsouPluginRepository=..\..\shinsou_plugin' '-Pkotlin.native.enableKlibsCrossCompilation=false' --stacktrace

      - name: Report desktop test failures
        if: steps.desktop_tests.outcome == 'failure'
        working-directory: shinsoux
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem "composeApp/build/test-results/desktopTest/TEST-*.xml" `
            -File -ErrorAction SilentlyContinue)
          $failedCases = @()
          foreach ($report in $reports) {
            [xml]$document = Get-Content -LiteralPath $report.FullName -Raw
            $failedCases += @($document.SelectNodes("//testcase[failure or error]"))
          }
          if ($failedCases.Count -eq 0) {
            throw "Desktop tests failed before producing a JUnit failure report."
          }
          foreach ($case in $failedCases) {
            $detailNode = @($case.failure, $case.error) |
              Where-Object { $null -ne $_ } |
              Select-Object -First 1
            $title = "Desktop test failed: $($case.classname).$($case.name)"
            $detail = if ($null -ne $detailNode.InnerText) {
              [string]$detailNode.InnerText
            } else {
              "No failure details were reported."
            }
            if ($detail.Length -gt 4000) { $detail = $detail.Substring(0, 4000) }
            $title = $title.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            $title = $title.Replace(":", "%3A").Replace(",", "%2C")
            $detail = $detail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=$title::$detail"
          }
          throw "$($failedCases.Count) desktop test(s) failed."

      # ADR-0002 S3: the plugin sandbox helper is built with MinGW-w64 (UCRT64).
      - name: Set up the sandbox helper toolchain
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja

      - name: Put the UCRT64 toolchain on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Compile desktop application
        working-directory: shinsoux
        run: .\gradlew.bat :composeApp:compileKotlinDesktop '-Pkotlin.native.enableKlibsCrossCompilation=false' --stacktrace

      - name: Build release app image
        working-directory: shinsoux
        run: .\gradlew.bat :composeApp:createReleaseDistributable '-Pkotlin.native.enableKlibsCrossCompilation=false' --stacktrace

      # ADR-0004 §4.5: the packaged offline translation helper, with a real model. The model sits in
      # a directory with a non-ASCII name: Windows profile directories often have one, and the engine
      # opens files through the C runtime.
      - name: Translate through the packaged helper
        working-directory: shinsoux
        shell: bash
        run: |
          set -euo pipefail
          helper="$(find composeApp/build/compose/binaries/main-release/app -name shinsou-translate.exe | head -n 1)"
          [[ -n "$helper" ]] || { echo "::error::the app carries no shinsou-translate.exe"; exit 1; }
          # Self-contained: system DLLs only.
          if objdump -p "$helper" | grep "DLL Name" | grep -v -i "KERNEL32.dll\|SHELL32.dll\|SHLWAPI.dll\|ADVAPI32.dll\|api-ms-win-crt-"; then
            echo "::error::the translation helper needs non-system DLLs"; exit 1
          fi
          [[ "$(printf 'UNLOAD\n' | "$helper")" == "OK 0" ]] || { echo "::error::the translation helper did not start"; exit 1; }

          models="$RUNNER_TEMP/翻譯模型 ja-en"
          mkdir -p "$models"
          base=https://firefox-settings-attachments.cdn.mozilla.net/main-workspace/translations-models
          fetch() { # name file sha256
            curl --fail --silent --show-error --location --retry 3 --output "$models/$1" "$base/$2"
            echo "$3  $models/$1" | sha256sum --check --quiet
          }
          fetch model.jaen.intgemm.alphas.bin 2b066368-11b5-4cee-92e8-e6156b334f80.bin 3a603e20bfe1be86071913f9e23ab5129075bc0a8490151020ac4821e4f17302
          fetch vocab.jaen.spm 6f4898e3-ebaa-4a79-a1af-93a4f65b96fa.spm 5cb217758bae05877bb3f0c2f612e4e7c1e4cb03c10db11f4a47098d7ae62919
          fetch lex.50.50.jaen.s2t.bin 4e6b3270-8a2f-491d-b717-f99749328622.bin 525f412f0d210536c2933c78ae395fa0bf2b5ee6cc5dda61ebc2e79410ebaee4
          directory="$(cygpath -w "$models")"
          answer="$(printf 'TRANSLATE 2\n%s\n%s\n%s\n%s\n葵は剣を抜いた。\n本当に行くの？\n' \
            "$directory\\model.jaen.intgemm.alphas.bin" "$directory\\vocab.jaen.spm" "$directory\\vocab.jaen.spm" \
            "$directory\\lex.50.50.jaen.s2t.bin" | "$helper")"
          echo "$answer"
          [[ "$(sed -n 1p <<< "$answer" | tr -d '\r')" == "OK 2" ]] || { echo "::error::the translation helper did not translate"; exit 1; }
          [[ "$(sed -n 2p <<< "$answer")" =~ [A-Za-z]{3} && "$(sed -n 3p <<< "$answer")" =~ [A-Za-z]{3} ]] || {
            echo "::error::the translation helper returned no English text"; exit 1
          }

      - name: Verify packaged desktop runtime with Windows Access Bridge
        working-directory: shinsoux
        shell: pwsh
        run: |
          $applications = @(Get-ChildItem `
            "composeApp/build/compose/binaries/main-release/app" `
            -Filter "Shinsou X.exe" -File -Recurse -ErrorAction SilentlyContinue)
          if ($applications.Count -ne 1) {
            throw "Expected exactly one release application executable, found $($applications.Count)."
          }
          $helper = Join-Path $applications[0].Directory.FullName "app/resources/shinsou-sandbox.exe"
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "The app must carry the plugin sandbox helper shinsou-sandbox.exe (ADR-0002 S3)."
          }
          # It must start confined on this image: run it the way the app does (a private copy, path-only
          # environment) with an empty input. 0 means the LPAC + Job copy started, verified its own
          # token and Job, read the end of its input and exited; 5 means it refused to run unconfined.
          $private = Join-Path ([IO.Path]::GetTempPath()) ("shinsou-sandbox-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $private | Out-Null
          Copy-Item -LiteralPath $helper -Destination $private
          $emptyInput = [IO.Path]::GetTempFileName() # zero bytes, outside the helper's directory
          $probe = Start-Process -FilePath (Join-Path $private "shinsou-sandbox.exe") `
            -ArgumentList "--package-key", "releasecheck" -RedirectStandardInput $emptyInput `
            -NoNewWindow -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            throw "The packaged plugin sandbox helper did not start confined (exit $($probe.ExitCode))."
          }
          & "scripts/ci/verify_windows_desktop_runtime.ps1" `
            -ApplicationPath $applications[0].FullName
