name: Sandbox S0 (Windows)

# ADR-0002 S0: AppContainer + Job Object prototype and the QuickJS core inside it.
# Runs only on the spike branch or on demand; it never gates master.
on:
  push:
    branches: [spike/sandbox-s0-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Fetch pinned third-party sources
        shell: msys2 {0}
        run: bash spikes/sandbox-s0/scripts/fetch-deps.sh

      - name: Build core_test (MinGW, static)
        shell: msys2 {0}
        run: |
          cmake -S spikes/sandbox-s0 -B spikes/sandbox-s0/build/win -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build spikes/sandbox-s0/build/win
          mkdir -p spikes/sandbox-s0/windows/build
          cp spikes/sandbox-s0/build/win/core_test.exe spikes/sandbox-s0/build/win/sandbox_helper.exe spikes/sandbox-s0/build/win/bootstrap.js spikes/sandbox-s0/windows/build/
          mv spikes/sandbox-s0/windows/build/sandbox_helper.exe spikes/sandbox-s0/windows/build/helper.exe

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build launcher and probe (MSVC)
        shell: cmd
        run: |
          cd spikes\sandbox-s0\windows
          cl /nologo /O2 /W3 /Fe:build\launcher.exe launcher.c userenv.lib advapi32.lib ws2_32.lib psapi.lib
          cl /nologo /O2 /W3 /Fe:build\probe.exe probe.c ws2_32.lib advapi32.lib

      - name: Isolation probe, core tests in the sandbox, cold start, kill-on-close
        shell: pwsh
        run: spikes/sandbox-s0/windows/run-ci.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-s0-${{ matrix.os }}
          path: spikes/sandbox-s0/windows/build/results.txt
