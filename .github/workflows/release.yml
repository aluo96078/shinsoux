name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      windows_package_version: ${{ steps.version.outputs.windows_package_version }}
      version_code: ${{ steps.version.outputs.version_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse version
        id: version
        shell: bash
        run: bash scripts/ci/parse_release_tag.sh "$GITHUB_REF_NAME"

  android:
    name: Android debug APK
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
      RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      ANDROID_PUBLIC_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_PUBLIC_DEBUG_KEYSTORE_BASE64 }}
      ANDROID_PUBLIC_DEBUG_KEYSTORE_PASSWORD: android
      ANDROID_PUBLIC_DEBUG_KEY_ALIAS: shinsou-public-debug
      ANDROID_PUBLIC_DEBUG_KEY_PASSWORD: android
    steps:
      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed public debug signing key
        shell: bash
        run: |
          [[ -n "$ANDROID_PUBLIC_DEBUG_KEYSTORE_BASE64" ]] || {
            echo "::error title=Missing Android signing key::ANDROID_PUBLIC_DEBUG_KEYSTORE_BASE64 is not configured."
            exit 1
          }
          keystore="$RUNNER_TEMP/shinsou-public-debug.jks"
          printf '%s' "$ANDROID_PUBLIC_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_PUBLIC_DEBUG_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew :composeApp:assembleDebug \
            -PreleaseVersion="$RELEASE_PACKAGE_VERSION" \
            -PreleaseDisplayVersion="$RELEASE_VERSION" \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            --stacktrace

      - name: Verify and stage debug APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(composeApp/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error title=Unexpected APK output::Expected exactly one debug APK, found ${#apks[@]}."
            exit 1
          fi
          [[ -s "${apks[0]}" ]] || {
            echo "::error title=Empty APK::${apks[0]} is empty."
            exit 1
          }

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -x "$apksigner" ]] || {
            echo "::error title=Missing apksigner::Could not find apksigner in $ANDROID_HOME/build-tools."
            exit 1
          }
          "$apksigner" verify --verbose --print-certs "${apks[0]}"
          expected_signer="2773a26348f63bf9486c449d7362e086320c0a8963a4c1778ceb288ccaf2df5a"
          actual_signer="$(
            "$apksigner" verify --print-certs "${apks[0]}" |
              sed -n -E \
                's/^(Signer #[0-9]+|V[0-9.]+ Signer:)[[:space:]]+certificate SHA-256 digest: //p' |
              sort -u
          )"
          [[ "$actual_signer" == "$expected_signer" ]] || {
            echo "::error title=Unexpected APK signer::Found $actual_signer; expected $expected_signer."
            exit 1
          }

          command -v apkanalyzer > /dev/null || {
            echo "::error title=Missing apkanalyzer::Android SDK apkanalyzer is not available."
            exit 1
          }
          actual_debuggable="$(apkanalyzer manifest debuggable "${apks[0]}")"
          actual_application_id="$(apkanalyzer manifest application-id "${apks[0]}")"
          actual_version_name="$(apkanalyzer manifest version-name "${apks[0]}")"
          actual_version_code="$(apkanalyzer manifest version-code "${apks[0]}")"
          [[ "$actual_debuggable" == true ]] || {
            echo "::error title=APK is not debuggable::Expected android:debuggable=true."
            exit 1
          }
          [[ "$actual_application_id" == dev.aluo.shinsoux ]] || {
            echo "::error title=Unexpected application ID::Found $actual_application_id."
            exit 1
          }
          [[ "$actual_version_name" == "$RELEASE_VERSION" ]] || {
            echo "::error title=Unexpected version name::Found $actual_version_name; expected $RELEASE_VERSION."
            exit 1
          }
          [[ "$actual_version_code" == "$RELEASE_VERSION_CODE" ]] || {
            echo "::error title=Unexpected version code::Found $actual_version_code; expected $RELEASE_VERSION_CODE."
            exit 1
          }

          mkdir -p build/release/android
          output="build/release/android/Shinsou-X-$RELEASE_VERSION-android-debug.apk"
          cp "${apks[0]}" "$output"
          sha256sum "$output"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build/release/android/*.apk
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS release DMG
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
      RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
    steps:
      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK for the shared Gradle module
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release DMG
        shell: bash
        run: |
          ./gradlew :composeApp:packageReleaseDmg \
            -PreleaseVersion="$RELEASE_PACKAGE_VERSION" \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            --stacktrace

      - name: Verify and stage DMG
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(composeApp/build/compose/binaries/main-release/dmg/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "::error title=Unexpected DMG output::Expected exactly one DMG, found ${#dmgs[@]}."
            exit 1
          fi
          [[ -s "${dmgs[0]}" ]] || {
            echo "::error title=Empty DMG::${dmgs[0]} is empty."
            exit 1
          }
          hdiutil verify "${dmgs[0]}"

          mount_dir="$(mktemp -d "$RUNNER_TEMP/shinsou-dmg-mount.XXXXXX")"
          probe_root="$(mktemp -d "$RUNNER_TEMP/shinsou-dmg-probe.XXXXXX")"
          mounted=false
          probe_pid=""
          cleanup() {
            if [[ -n "$probe_pid" ]] && kill -0 "$probe_pid" 2>/dev/null; then
              kill "$probe_pid" 2>/dev/null || true
              wait "$probe_pid" 2>/dev/null || true
            fi
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true
            fi
            rm -rf -- "$mount_dir" "$probe_root"
          }
          trap cleanup EXIT

          hdiutil attach "${dmgs[0]}" -readonly -nobrowse -mountpoint "$mount_dir"
          mounted=true
          applications=("$mount_dir"/*.app/Contents/MacOS/"Shinsou X")
          if (( ${#applications[@]} != 1 )) || [[ ! -x "${applications[0]}" ]]; then
            echo "::error title=Unexpected DMG application::Expected one executable, found ${#applications[@]}."
            exit 1
          fi

          sqlite_jars=("$mount_dir"/*.app/Contents/app/sqlite-jdbc-*.jar)
          if (( ${#sqlite_jars[@]} != 1 )); then
            echo "::error title=Unexpected SQLite runtime::Expected one sqlite-jdbc JAR, found ${#sqlite_jars[@]}."
            exit 1
          fi
          unzip -Z1 "${sqlite_jars[0]}" | grep -Fx 'org/sqlite/JDBC.class'
          unzip -Z1 "${sqlite_jars[0]}" | grep -Fx 'META-INF/services/java.sql.Driver'

          probe_home="$probe_root/home"
          marker="$probe_root/completed.marker"
          stdout_log="$probe_root/stdout.log"
          stderr_log="$probe_root/stderr.log"
          token="$(uuidgen | tr -d '-')"
          mkdir -p "$probe_home"
          HOME="$probe_home" \
            JAVA_TOOL_OPTIONS="-Duser.home=$probe_home" \
            SHINSOU_DESKTOP_PROBE_MARKER="$marker" \
            SHINSOU_DESKTOP_PROBE_TOKEN="$token" \
            "${applications[0]}" --verify-desktop-startup \
            >"$stdout_log" 2>"$stderr_log" &
          probe_pid=$!

          probe_exited=false
          probe_status=0
          for _ in {1..180}; do
            if ! kill -0 "$probe_pid" 2>/dev/null; then
              if wait "$probe_pid"; then
                probe_status=0
              else
                probe_status=$?
              fi
              probe_pid=""
              probe_exited=true
              break
            fi
            sleep 0.5
          done
          cat "$stdout_log" || true
          cat "$stderr_log" >&2 || true
          if [[ "$probe_exited" != true ]]; then
            echo "::error title=DMG startup timed out::The packaged app did not exit within 90 seconds."
            exit 1
          fi
          if (( probe_status != 0 )); then
            echo "::error title=DMG startup failed::The packaged app exited with status $probe_status."
            exit 1
          fi
          [[ -f "$marker" ]] && [[ "$(<"$marker")" == "$token" ]] || {
            echo "::error title=DMG startup marker missing::The packaged app did not reach its first rendered frame."
            exit 1
          }
          [[ -f "$probe_home/Library/Application Support/Shinsou/SyncV2/local-sync.db" ]] || {
            echo "::error title=DMG SQLite startup failed::The packaged app did not initialize its SQLite database."
            exit 1
          }

          case "$(uname -m)" in
            arm64) architecture=arm64 ;;
            x86_64) architecture=x64 ;;
            *)
              echo "::error title=Unsupported macOS architecture::$(uname -m)"
              exit 1
              ;;
          esac
          mkdir -p build/release/macos
          output="build/release/macos/Shinsou-X-$RELEASE_VERSION-macos-$architecture.dmg"
          cp "${dmgs[0]}" "$output"
          shasum -a 256 "$output"

      - name: Upload DMG workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: build/release/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows release MSI and EXE
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
      RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      WINDOWS_PACKAGE_VERSION: ${{ needs.metadata.outputs.windows_package_version }}
    steps:
      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Windows packaging tools
        shell: pwsh
        run: |
          Get-Command candle.exe -ErrorAction Stop
          Get-Command light.exe -ErrorAction Stop

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installers
        shell: pwsh
        run: |
          .\gradlew.bat `
            :composeApp:createReleaseDistributable `
            :composeApp:packageReleaseMsi `
            :composeApp:packageReleaseExe `
            "-PreleaseVersion=$env:RELEASE_PACKAGE_VERSION" `
            "-PwindowsPackageVersion=$env:WINDOWS_PACKAGE_VERSION" `
            "-PreleaseVersionCode=$env:RELEASE_VERSION_CODE" `
            --stacktrace

      - name: Verify release app image with Windows Access Bridge
        shell: pwsh
        run: |
          $applications = @(Get-ChildItem `
            "composeApp/build/compose/binaries/main-release/app" `
            -Filter "Shinsou X.exe" -File -Recurse -ErrorAction SilentlyContinue)
          if ($applications.Count -ne 1) {
            throw "Expected exactly one release application executable, found $($applications.Count)."
          }
          & "scripts/ci/verify_windows_desktop_runtime.ps1" `
            -ApplicationPath $applications[0].FullName

      - name: Verify MSI identity and package version
        shell: pwsh
        run: |
          $msis = @(Get-ChildItem `
            "composeApp/build/compose/binaries/main-release/msi/*.msi" `
            -File -ErrorAction SilentlyContinue)
          if ($msis.Count -ne 1) {
            throw "Expected exactly one MSI for identity verification, found $($msis.Count)."
          }

          function Get-MsiProperty {
            param(
              [Parameter(Mandatory = $true)] [string]$Path,
              [Parameter(Mandatory = $true)] [string]$Name
            )
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $database = $installer.GetType().InvokeMember(
              "OpenDatabase",
              "InvokeMethod",
              $null,
              $installer,
              @($Path, 0)
            )
            $query = "SELECT ``Value`` FROM ``Property`` WHERE ``Property``='$Name'"
            $view = $database.GetType().InvokeMember(
              "OpenView",
              "InvokeMethod",
              $null,
              $database,
              @($query)
            )
            $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null) | Out-Null
            $record = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
            if ($null -eq $record) {
              throw "MSI property $Name does not exist."
            }
            return [string]$record.GetType().InvokeMember(
              "StringData",
              "GetProperty",
              $null,
              $record,
              1
            )
          }

          $productVersion = Get-MsiProperty -Path $msis[0].FullName -Name "ProductVersion"
          $productCode = Get-MsiProperty -Path $msis[0].FullName -Name "ProductCode"
          $upgradeCode = Get-MsiProperty -Path $msis[0].FullName -Name "UpgradeCode"
          if ($productVersion -cne $env:WINDOWS_PACKAGE_VERSION) {
            throw "MSI ProductVersion is $productVersion; expected $env:WINDOWS_PACKAGE_VERSION."
          }
          $beta3ProductCode = "{C69CAFF8-4EA3-3D4D-AF7A-C62057150FE9}"
          if ($productCode -ieq $beta3ProductCode) {
            throw "MSI ProductCode still matches beta.3: $productCode."
          }
          $expectedUpgradeCode = "{1E4B4C87-A9D7-4C41-9270-401E627717A9}"
          if ($upgradeCode -ine $expectedUpgradeCode) {
            throw "MSI UpgradeCode is $upgradeCode; expected $expectedUpgradeCode."
          }
          "CURRENT_MSI_PRODUCT_CODE=$productCode" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Verified MSI ProductVersion $productVersion, ProductCode $productCode, and UpgradeCode $upgradeCode."

      - name: Install previous Windows upgrade baseline
        if: >-
          needs.metadata.outputs.tag == 'v1.0.0-beta.4' ||
          needs.metadata.outputs.tag == 'v1.0.0-beta.5' ||
          needs.metadata.outputs.tag == 'v1.0.0' ||
          needs.metadata.outputs.tag == 'v1.0.1-beta.1' ||
          needs.metadata.outputs.tag == 'v1.0.1-beta.2' ||
          needs.metadata.outputs.tag == 'v1.0.1-beta.3' ||
          needs.metadata.outputs.tag == 'v1.0.1-beta.4' ||
          needs.metadata.outputs.tag == 'v1.0.1-beta.5'
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -in @("1.0.0-beta.4", "1.0.0-beta.5")) {
            $baselineVersion = "1.0.0-beta.3"
            $expectedHash = "9f6092c5af59a1787e80ebe35e090cc5610c55679046e26c239e4a4d2997dbfb"
            $baselineProductCode = "{C69CAFF8-4EA3-3D4D-AF7A-C62057150FE9}"
          } elseif ($env:RELEASE_VERSION -eq "1.0.0") {
            $baselineVersion = "1.0.0-beta.5"
            $expectedHash = "1d58a19dfa67b8305207c1a535261b7b45cb0c9b36ae60caa0f20f25d90a0d47"
            $baselineProductCode = "{5BD1AE7E-28FC-3F3C-9C0C-E7B2748B44A8}"
          } elseif ($env:RELEASE_VERSION -eq "1.0.1-beta.1") {
            $baselineVersion = "1.0.0"
            $expectedHash = "cb8576e8839dda27c4d9e056101efb93ca5263f4045661837fd5cdac50b77373"
            $baselineProductCode = "{EBE5F46E-732E-3339-B58E-06802AE720A1}"
          } elseif ($env:RELEASE_VERSION -eq "1.0.1-beta.2") {
            $baselineVersion = "1.0.1-beta.1"
            $expectedHash = "c657180975070f1a4b93084d5bd834404db3049ef83f660f795dda783dbf611d"
            $baselineProductCode = "{25DB634E-B73F-3BE7-92DA-2F2A73109CC4}"
          } elseif ($env:RELEASE_VERSION -eq "1.0.1-beta.3") {
            $baselineVersion = "1.0.1-beta.2"
            $expectedHash = "3c41e90ec8c407f9a7a9e815da56277538668471a0bdd8f193cc4e9d9c2f9a42"
            $baselineProductCode = "{370B6BB6-1112-3D36-A780-D144FF2496DD}"
          } elseif ($env:RELEASE_VERSION -eq "1.0.1-beta.4") {
            $baselineVersion = "1.0.1-beta.3"
            $expectedHash = "e64244a335274206b34be7ec35cd8e67cd880cf40ec1133aaca90d9798bef4e6"
            $baselineProductCode = "{81C4ACA7-83D2-3608-84F9-215F8283D882}"
          } elseif ($env:RELEASE_VERSION -eq "1.0.1-beta.5") {
            $baselineVersion = "1.0.1-beta.4"
            $expectedHash = "a40e1814caed003a719b0eecc905c9b1022f349400a616dc8191f3c605bb057f"
            $baselineProductCode = "{D5617664-F9F4-3BD5-8545-AECA58335574}"
          } else {
            throw "No Windows upgrade baseline is configured for $env:RELEASE_VERSION."
          }

          $baselineFileName = "Shinsou-X-$baselineVersion-windows-x64.msi"
          $baseline = Join-Path $env:RUNNER_TEMP $baselineFileName
          Invoke-WebRequest `
            -Uri "https://github.com/aluo96078/shinsoux/releases/download/v$baselineVersion/$baselineFileName" `
            -OutFile $baseline
          $actualHash = (Get-FileHash -LiteralPath $baseline -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $expectedHash) {
            throw "$baselineVersion MSI SHA-256 is $actualHash; expected $expectedHash."
          }

          $installLog = Join-Path $env:RUNNER_TEMP "shinsou-$baselineVersion-msi-install.log"
          $arguments = "/i `"$baseline`" /qn /norestart /L*v `"$installLog`""
          $process = Start-Process `
            -FilePath "$env:SystemRoot\System32\msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            if (Test-Path -LiteralPath $installLog) {
              Get-Content -LiteralPath $installLog -Tail 500
            }
            throw "$baselineVersion MSI installation failed with exit code $($process.ExitCode)."
          }

          "BASELINE_MSI_PRODUCT_CODE=$baselineProductCode" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASELINE_MSI_VERSION=$baselineVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          $windowsInstaller = New-Object -ComObject WindowsInstaller.Installer
          $baselineState = $windowsInstaller.GetType().InvokeMember(
            "ProductState",
            "GetProperty",
            $null,
            $windowsInstaller,
            @($baselineProductCode)
          )
          if ([int]$baselineState -ne 5) {
            throw "$baselineVersion MSI product state is $baselineState; expected 5 (installed)."
          }
          Write-Host "Installed $baselineVersion as the upgrade baseline."

      - name: Install MSI and verify installed application
        shell: pwsh
        run: |
          $msis = @(Get-ChildItem `
            "composeApp/build/compose/binaries/main-release/msi/*.msi" `
            -File -ErrorAction SilentlyContinue)
          if ($msis.Count -ne 1) {
            throw "Expected exactly one MSI before installation, found $($msis.Count)."
          }

          $installLog = Join-Path $env:RUNNER_TEMP "shinsou-msi-install.log"
          $arguments = "/i `"$($msis[0].FullName)`" /qn /norestart /L*v `"$installLog`""
          $installer = Start-Process `
            -FilePath "$env:SystemRoot\System32\msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru
          if ($installer.ExitCode -notin @(0, 3010)) {
            if (Test-Path -LiteralPath $installLog) {
              Get-Content -LiteralPath $installLog -Tail 500
            }
            throw "MSI installation failed with exit code $($installer.ExitCode)."
          }

          function Test-MsiProductInstalled([string]$ProductCode) {
            $windowsInstaller = New-Object -ComObject WindowsInstaller.Installer
            $state = $windowsInstaller.GetType().InvokeMember(
              "ProductState",
              "GetProperty",
              $null,
              $windowsInstaller,
              @($ProductCode)
            )
            return [int]$state -eq 5
          }
          if (-not (Test-MsiProductInstalled $env:CURRENT_MSI_PRODUCT_CODE)) {
            throw "Current MSI product $env:CURRENT_MSI_PRODUCT_CODE is not installed."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:BASELINE_MSI_PRODUCT_CODE) -and
              (Test-MsiProductInstalled $env:BASELINE_MSI_PRODUCT_CODE)) {
            throw "MSI upgrade left $env:BASELINE_MSI_VERSION product $env:BASELINE_MSI_PRODUCT_CODE installed."
          }

          $installedApplication = Join-Path $env:ProgramFiles "Shinsou X\Shinsou X.exe"
          & "scripts/ci/verify_windows_desktop_runtime.ps1" `
            -ApplicationPath $installedApplication

      - name: Verify and stage Windows installers
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem `
            "composeApp/build/compose/binaries/main-release/msi/*.msi" `
            -File -ErrorAction SilentlyContinue)
          $exe = @(Get-ChildItem `
            "composeApp/build/compose/binaries/main-release/exe/*.exe" `
            -File -ErrorAction SilentlyContinue)
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI, found $($msi.Count)." }
          if ($exe.Count -ne 1) { throw "Expected exactly one EXE, found $($exe.Count)." }
          if ($msi[0].Length -le 0) { throw "MSI output is empty." }
          if ($exe[0].Length -le 0) { throw "EXE output is empty." }

          $outputDirectory = "build/release/windows"
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          $msiOutput = Join-Path $outputDirectory `
            "Shinsou-X-$env:RELEASE_VERSION-windows-x64.msi"
          $exeOutput = Join-Path $outputDirectory `
            "Shinsou-X-$env:RELEASE_VERSION-windows-x64.exe"
          Copy-Item -LiteralPath $msi[0].FullName -Destination $msiOutput
          Copy-Item -LiteralPath $exe[0].FullName -Destination $exeOutput
          Get-FileHash -Path $msiOutput -Algorithm SHA256
          Get-FileHash -Path $exeOutput -Algorithm SHA256

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            build/release/windows/*.msi
            build/release/windows/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs:
      - metadata
      - android
      - macos
      - windows
    if: >-
      ${{
        always() &&
        needs.metadata.result == 'success' &&
        needs.android.result == 'success' &&
        needs.macos.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release set
        shell: bash
        run: |
          shopt -s nullglob
          apks=(release-assets/*.apk)
          ipas=(release-assets/*.ipa)
          dmgs=(release-assets/*.dmg)
          msis=(release-assets/*.msi)
          exes=(release-assets/*.exe)

          [[ ${#apks[@]} -eq 1 ]] || { echo "Expected one Android debug APK, found ${#apks[@]}." >&2; exit 1; }
          [[ "${apks[0]##*/}" == "Shinsou-X-$RELEASE_VERSION-android-debug.apk" ]] || {
            echo "Unexpected Android APK name: ${apks[0]##*/}." >&2
            exit 1
          }
          [[ ${#ipas[@]} -eq 0 ]] || { echo "Expected no iOS IPA, found ${#ipas[@]}." >&2; exit 1; }
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "Expected one DMG, found ${#dmgs[@]}." >&2; exit 1; }
          [[ ${#msis[@]} -eq 1 ]] || { echo "Expected one MSI, found ${#msis[@]}." >&2; exit 1; }
          [[ ${#exes[@]} -eq 1 ]] || { echo "Expected one EXE, found ${#exes[@]}." >&2; exit 1; }

          assets=("${apks[@]}" "${ipas[@]}" "${dmgs[@]}" "${msis[@]}" "${exes[@]}")
          for asset in "${assets[@]}"; do
            [[ -s "$asset" ]] || { echo "Release asset is empty: $asset" >&2; exit 1; }
          done

          (
            cd release-assets
            asset_names=()
            for asset in "${assets[@]}"; do
              asset_names+=("${asset##*/}")
            done
            sha256sum "${asset_names[@]}" | LC_ALL=C sort -k2
          ) > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Prepare release notes
        shell: bash
        run: |
          {
            if [[ "$RELEASE_PRERELEASE" == true ]]; then
              printf '%s\n\n' \
                "This is a beta prerelease for validation. Back up your library before installing it."
            fi

            printf '%s\n\n%s\n' \
              "Shinsou X $RELEASE_VERSION release." \
              "Included platforms:"
            printf '%s\n' \
              "- Android: debug-signed APK for testing; it is not a production-signed release build." \
              "- macOS: DMG (not notarized; Gatekeeper may warn)." \
              "- Windows: MSI and EXE (not Authenticode-signed; SmartScreen may warn)."

            printf '\n%s\n%s\n' \
              "Not distributed:" \
              "- iOS: no IPA is published. Build from source on macOS with Xcode: https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/BUILDING.md"

            printf '\n%s\n' "Verify every download with SHA256SUMS.txt."
            if [[ "$RELEASE_VERSION" == 1.0.0-beta.4 ||
                  "$RELEASE_VERSION" == 1.0.0-beta.5 ||
                  "$RELEASE_VERSION" == 1.0.0 ||
                  "$RELEASE_VERSION" == 1.0.1-beta.1 ||
                  "$RELEASE_VERSION" == 1.0.1-beta.2 ||
                  "$RELEASE_VERSION" == 1.0.1-beta.3 ||
                  "$RELEASE_VERSION" == 1.0.1-beta.4 ||
                  "$RELEASE_VERSION" == 1.0.1-beta.5 ]]; then
              printf '%s\n' \
                "Android note: beta.3 and older APKs used different ephemeral signatures. Back up and uninstall those versions once before installing this release; beta.5 and later official debug APKs use a fixed test signer." \
                "Desktop note: this release restores packaged SQLite startup on macOS and Windows; Windows also uses a corrected MSI upgrade version, the Shinsou X title-bar icon, and a native Windows layout without the duplicate menu bar."
            fi
            if [[ "$RELEASE_VERSION" == 1.0.1-beta.1 ]]; then
              printf '%s\n' \
                "Extension note: this beta fixes reviewed ShuYue extension installation failing with ‘ShuYue script is not in quarantine’ in ProGuard-shrunk desktop packages."
            fi
            if [[ "$RELEASE_VERSION" == 1.0.1-beta.2 ]]; then
              printf '%s\n' \
                "Library note: this beta keeps extension favorites in the local library, restores their source-backed chapter lists, opens them without leaving the library, and labels titles as manga or novel from authoritative source metadata."
            fi
            if [[ "$RELEASE_VERSION" == 1.0.1-beta.3 ]]; then
              printf '%s\n' \
                "Reader note: this beta preserves page-level reading progress across extension manga and novels, restores EPUB positions, and fixes manga controls, paging direction, long-image sizing, and backward navigation." \
                "Extension note: login requests now explain macOS Keychain password prompts; local Apple Development builds can retain Keychain authorization across updates when signed with the same certificate. Public DMGs remain unnotarized and ad-hoc signed until Developer ID credentials are configured."
            fi
            if [[ "$RELEASE_VERSION" == 1.0.1-beta.4 ]]; then
              printf '%s\n' \
                "Reader note: this beta shows loading feedback while opening chapters and during chapter transitions, and enables configured volume-key paging in extension readers." \
                "macOS note: authorized Keychain reads now remain silent; Shinsou X shows its purpose explanation and requests system authorization only when macOS reports that interaction is required."
            fi
            if [[ "$RELEASE_VERSION" == 1.0.1-beta.5 ]]; then
              printf '%s\n' \
                "Reader note: this beta keeps novel controls floating above content, restores safe-area layout, de-duplicates mobile volume-key paging, prevents premature chapter changes, and rejects stale progress callbacks during chapter transitions." \
                "Library note: extension titles opened directly from the local library now hydrate their complete chapter directory, credentials, and exact local resume chapter before continuing." \
                "Proxy note: every source can follow the global Cloudflare Worker Proxy setting, force-enable it, or force-disable it; proxied requests use the current platform browser User-Agent unless a captured Cloudflare session or explicit override is present."
            fi
          } > release-notes.md

      - name: Publish verified release
        shell: bash
        run: |
          ref_json="$(gh api "/repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -r '.object.type' <<< "$ref_json")"
          object_sha="$(jq -r '.object.sha' <<< "$ref_json")"
          ref_object_sha="$object_sha"
          for _ in 1 2 3 4 5; do
            [[ "$object_type" == tag ]] || break
            tag_json="$(gh api "/repos/$GH_REPO/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<< "$tag_json")"
            object_sha="$(jq -r '.object.sha' <<< "$tag_json")"
          done
          if [[ "$object_type" != commit || (
            "$ref_object_sha" != "$RELEASE_COMMIT" && "$object_sha" != "$RELEASE_COMMIT"
          ) ]]; then
            echo "Tag $RELEASE_TAG now resolves through $ref_object_sha to $object_type $object_sha; expected event SHA $RELEASE_COMMIT." >&2
            exit 1
          fi

          gh api --paginate \
            "/repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" \
            > "$RUNNER_TEMP/matching-release-ids.txt"
          mapfile -t release_ids < "$RUNNER_TEMP/matching-release-ids.txt"

          if (( ${#release_ids[@]} == 1 )); then
            release_id="${release_ids[0]}"
            gh api "/repos/$GH_REPO/releases/$release_id" \
              --method PATCH \
              -F draft=true \
              --silent
          elif (( ${#release_ids[@]} == 0 )); then
            create_payload="$(
              jq -n \
                --arg tag_name "$RELEASE_TAG" \
                --arg target_commitish "$RELEASE_COMMIT" \
                --arg name "Shinsou X $RELEASE_VERSION" \
                --arg body "Preparing verified release assets." \
                --argjson prerelease "$RELEASE_PRERELEASE" \
                '{
                  tag_name: $tag_name,
                  target_commitish: $target_commitish,
                  name: $name,
                  body: $body,
                  draft: true,
                  prerelease: $prerelease
                }'
            )"
            release_json="$(
              gh api "/repos/$GH_REPO/releases" \
                --method POST \
                --input - <<< "$create_payload"
            )"
            release_id="$(jq -er '.id' <<< "$release_json")"
          else
            echo "Expected at most one release for $RELEASE_TAG, found ${#release_ids[@]}." >&2
            exit 1
          fi

          gh api --paginate \
            "/repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            --jq '.[].id' > "$RUNNER_TEMP/existing-release-assets.txt"
          while IFS= read -r asset_id; do
            [[ -n "$asset_id" ]] || continue
            gh api "/repos/$GH_REPO/releases/assets/$asset_id" \
              --method DELETE \
              --silent
          done < "$RUNNER_TEMP/existing-release-assets.txt"

          for asset in release-assets/*; do
            [[ -f "$asset" ]] || continue
            asset_name="${asset##*/}"
            encoded_asset_name="$(
              jq -rn --arg value "$asset_name" '$value | @uri'
            )"
            gh api \
              "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$encoded_asset_name" \
              --method POST \
              --header "Content-Type: application/octet-stream" \
              --input "$asset" \
              --silent
          done

          find release-assets -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort \
            > "$RUNNER_TEMP/expected-release-assets.txt"
          gh api --paginate \
            "/repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            --jq '.[].name' | LC_ALL=C sort \
            > "$RUNNER_TEMP/actual-release-assets.txt"
          diff -u \
            "$RUNNER_TEMP/expected-release-assets.txt" \
            "$RUNNER_TEMP/actual-release-assets.txt"

          release_body="$(< release-notes.md)"
          publish_payload="$(
            jq -n \
              --arg tag_name "$RELEASE_TAG" \
              --arg target_commitish "$RELEASE_COMMIT" \
              --arg name "Shinsou X $RELEASE_VERSION" \
              --arg body "$release_body" \
              --argjson prerelease "$RELEASE_PRERELEASE" \
              '{
                tag_name: $tag_name,
                target_commitish: $target_commitish,
                name: $name,
                body: $body,
                draft: false,
                prerelease: $prerelease,
                make_latest: (if $prerelease then "false" else "true" end)
              }'
          )"
          published_release="$(
            gh api "/repos/$GH_REPO/releases/$release_id" \
              --method PATCH \
              --input - <<< "$publish_payload"
          )"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson prerelease "$RELEASE_PRERELEASE" \
            '(.tag_name == $tag) and (.draft == false) and (.prerelease == $prerelease)' \
            <<< "$published_release" > /dev/null
