name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      version_code: ${{ steps.version.outputs.version_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse version
        id: version
        shell: bash
        run: bash scripts/ci/parse_release_tag.sh "$GITHUB_REF_NAME"

  android:
    name: Android release APK
    needs: metadata
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
      RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Import Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Missing Android signing secrets::Configure the release environment secrets: ${missing[*]}."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/shinsou-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          [[ -s "$keystore_path" ]] || {
            echo "::error title=Invalid Android keystore::Decoded keystore is empty."
            exit 1
          }
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          ./gradlew :composeApp:assembleRelease \
            -PreleaseVersion="$RELEASE_PACKAGE_VERSION" \
            -PreleaseDisplayVersion="$RELEASE_VERSION" \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(composeApp/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error title=Unexpected APK output::Expected exactly one release APK, found ${#apks[@]}."
            exit 1
          fi
          [[ -s "${apks[0]}" ]] || {
            echo "::error title=Empty APK::${apks[0]} is empty."
            exit 1
          }

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -x "$apksigner" ]] || {
            echo "::error title=Missing apksigner::Could not find apksigner in $ANDROID_HOME/build-tools."
            exit 1
          }
          "$apksigner" verify --verbose --print-certs "${apks[0]}"

          mkdir -p build/release/android
          output="build/release/android/Shinsou-X-$RELEASE_VERSION-android.apk"
          cp "${apks[0]}" "$output"
          sha256sum "$output"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build/release/android/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS App Store IPA
    needs: metadata
    runs-on: macos-15
    environment: release
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
      RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      IOS_TEAM_ID: 5UKY38ZLK6
    steps:
      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK for the shared Gradle module
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Archive and export signed IPA
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          OUTPUT_DIR: ${{ github.workspace }}/build/release/ios
        run: bash scripts/ci/build_ios_ipa.sh

      - name: Upload IPA workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: build/release/ios/*.ipa
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS release DMG
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
      RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
    steps:
      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK for the shared Gradle module
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release DMG
        shell: bash
        run: |
          ./gradlew :composeApp:packageReleaseDmg \
            -PreleaseVersion="$RELEASE_PACKAGE_VERSION" \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            --stacktrace

      - name: Verify and stage DMG
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(composeApp/build/compose/binaries/main-release/dmg/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "::error title=Unexpected DMG output::Expected exactly one DMG, found ${#dmgs[@]}."
            exit 1
          fi
          [[ -s "${dmgs[0]}" ]] || {
            echo "::error title=Empty DMG::${dmgs[0]} is empty."
            exit 1
          }
          hdiutil verify "${dmgs[0]}"

          case "$(uname -m)" in
            arm64) architecture=arm64 ;;
            x86_64) architecture=x64 ;;
            *)
              echo "::error title=Unsupported macOS architecture::$(uname -m)"
              exit 1
              ;;
          esac
          mkdir -p build/release/macos
          output="build/release/macos/Shinsou-X-$RELEASE_VERSION-macos-$architecture.dmg"
          cp "${dmgs[0]}" "$output"
          shasum -a 256 "$output"

      - name: Upload DMG workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: build/release/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows release MSI and EXE
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
      RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
    steps:
      - name: Check out Shinsou X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Windows packaging tools
        shell: pwsh
        run: |
          Get-Command candle.exe -ErrorAction Stop
          Get-Command light.exe -ErrorAction Stop

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installers
        shell: pwsh
        run: |
          .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            :composeApp:packageReleaseExe `
            "-PreleaseVersion=$env:RELEASE_PACKAGE_VERSION" `
            "-PreleaseVersionCode=$env:RELEASE_VERSION_CODE" `
            --stacktrace

      - name: Verify and stage Windows installers
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem `
            "composeApp/build/compose/binaries/main-release/msi/*.msi" `
            -File -ErrorAction SilentlyContinue)
          $exe = @(Get-ChildItem `
            "composeApp/build/compose/binaries/main-release/exe/*.exe" `
            -File -ErrorAction SilentlyContinue)
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI, found $($msi.Count)." }
          if ($exe.Count -ne 1) { throw "Expected exactly one EXE, found $($exe.Count)." }
          if ($msi[0].Length -le 0) { throw "MSI output is empty." }
          if ($exe[0].Length -le 0) { throw "EXE output is empty." }

          $outputDirectory = "build/release/windows"
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          $msiOutput = Join-Path $outputDirectory `
            "Shinsou-X-$env:RELEASE_VERSION-windows-x64.msi"
          $exeOutput = Join-Path $outputDirectory `
            "Shinsou-X-$env:RELEASE_VERSION-windows-x64.exe"
          Copy-Item -LiteralPath $msi[0].FullName -Destination $msiOutput
          Copy-Item -LiteralPath $exe[0].FullName -Destination $exeOutput
          Get-FileHash -Path $msiOutput -Algorithm SHA256
          Get-FileHash -Path $exeOutput -Algorithm SHA256

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            build/release/windows/*.msi
            build/release/windows/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs:
      - metadata
      - android
      - ios
      - macos
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release set
        shell: bash
        run: |
          shopt -s nullglob
          apks=(release-assets/*.apk)
          ipas=(release-assets/*.ipa)
          dmgs=(release-assets/*.dmg)
          msis=(release-assets/*.msi)
          exes=(release-assets/*.exe)

          [[ ${#apks[@]} -eq 1 ]] || { echo "Expected one APK, found ${#apks[@]}." >&2; exit 1; }
          [[ ${#ipas[@]} -eq 1 ]] || { echo "Expected one IPA, found ${#ipas[@]}." >&2; exit 1; }
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "Expected one DMG, found ${#dmgs[@]}." >&2; exit 1; }
          [[ ${#msis[@]} -eq 1 ]] || { echo "Expected one MSI, found ${#msis[@]}." >&2; exit 1; }
          [[ ${#exes[@]} -eq 1 ]] || { echo "Expected one EXE, found ${#exes[@]}." >&2; exit 1; }

          for asset in "${apks[@]}" "${ipas[@]}" "${dmgs[@]}" "${msis[@]}" "${exes[@]}"; do
            [[ -s "$asset" ]] || { echo "Release asset is empty: $asset" >&2; exit 1; }
          done

          (
            cd release-assets
            sha256sum ./*.apk ./*.ipa ./*.dmg ./*.msi ./*.exe | LC_ALL=C sort -k2
          ) > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Prepare release notes
        shell: bash
        run: |
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            printf '%s\n\n' \
              "This is a beta prerelease for validation. Back up your library before installing it." \
              > release-notes.md
          else
            : > release-notes.md
          fi
          printf '%s\n' \
            "Shinsou X $RELEASE_VERSION multi-platform release." \
            "" \
            "- Android APK is signed with the configured release key." \
            "- iOS IPA is signed for App Store Connect distribution and is not a direct sideload package." \
            "- macOS DMG is currently not notarized." \
            "- Windows MSI and EXE are currently not Authenticode-signed, so SmartScreen may warn." \
            "- Verify downloads with SHA256SUMS.txt." \
            >> release-notes.md

      - name: Publish complete release
        shell: bash
        run: |
          ref_json="$(gh api "/repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -r '.object.type' <<< "$ref_json")"
          object_sha="$(jq -r '.object.sha' <<< "$ref_json")"
          ref_object_sha="$object_sha"
          for _ in 1 2 3 4 5; do
            [[ "$object_type" == tag ]] || break
            tag_json="$(gh api "/repos/$GH_REPO/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<< "$tag_json")"
            object_sha="$(jq -r '.object.sha' <<< "$tag_json")"
          done
          if [[ "$object_type" != commit || (
            "$ref_object_sha" != "$RELEASE_COMMIT" && "$object_sha" != "$RELEASE_COMMIT"
          ) ]]; then
            echo "Tag $RELEASE_TAG now resolves through $ref_object_sha to $object_type $object_sha; expected event SHA $RELEASE_COMMIT." >&2
            exit 1
          fi

          gh api --paginate \
            "/repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" \
            > "$RUNNER_TEMP/matching-release-ids.txt"
          mapfile -t release_ids < "$RUNNER_TEMP/matching-release-ids.txt"

          if (( ${#release_ids[@]} == 1 )); then
            release_id="${release_ids[0]}"
            gh api "/repos/$GH_REPO/releases/$release_id" \
              --method PATCH \
              -F draft=true \
              --silent
          elif (( ${#release_ids[@]} == 0 )); then
            create_args=(
              "$RELEASE_TAG"
              --verify-tag \
              --draft \
              --title "Shinsou X $RELEASE_VERSION" \
              --notes "Preparing verified release assets."
            )
            if [[ "$RELEASE_PRERELEASE" == true ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
            release_id="$(
              gh api --paginate \
                "/repos/$GH_REPO/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id"
            )"
            [[ -n "$release_id" ]] || {
              echo "Created draft release could not be resolved." >&2
              exit 1
            }
          else
            echo "Expected at most one release for $RELEASE_TAG, found ${#release_ids[@]}." >&2
            exit 1
          fi

          gh api --paginate \
            "/repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            --jq '.[].id' > "$RUNNER_TEMP/existing-release-assets.txt"
          while IFS= read -r asset_id; do
            [[ -n "$asset_id" ]] || continue
            gh api "/repos/$GH_REPO/releases/assets/$asset_id" \
              --method DELETE \
              --silent
          done < "$RUNNER_TEMP/existing-release-assets.txt"

          gh release upload "$RELEASE_TAG" release-assets/*

          find release-assets -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort \
            > "$RUNNER_TEMP/expected-release-assets.txt"
          gh api --paginate \
            "/repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            --jq '.[].name' | LC_ALL=C sort \
            > "$RUNNER_TEMP/actual-release-assets.txt"
          diff -u \
            "$RUNNER_TEMP/expected-release-assets.txt" \
            "$RUNNER_TEMP/actual-release-assets.txt"

          edit_args=(
            "$RELEASE_TAG"
            --draft=false
            --prerelease="$RELEASE_PRERELEASE"
            --title "Shinsou X $RELEASE_VERSION"
            --notes-file release-notes.md
          )
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            edit_args+=(--latest=false)
          fi
          gh release edit "${edit_args[@]}"
