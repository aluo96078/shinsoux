name: Checks

# R2-3 (docs/architecture/0006): what every change has to pass before it is merged or released:
# static analysis with its baselines, the layering check and the desktop tests (Linux, the
# quickest runner) with the merged coverage bound, the Android unit tests (macOS) and the Swift
# layer (SwiftLint, XCTest of its pure logic, a compile check of the macOS helper; macOS).
# release.yml calls this before it builds anything.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check (the release source)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: detekt and its baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # detektProduct includes the Android analysis with type resolution (detektDebugAndroid), which
      # compiles the debug variant against the Android SDK. Kotlin/Native has no typed detekt task:
      # the iOS source sets are analysed without type resolution (0007 C6).
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # R5-1: every module has its own detektProduct; the unqualified name runs them all.
      - name: detekt
        run: ./gradlew detektProduct -Pkotlin.native.enableKlibsCrossCompilation=false --stacktrace

      # A baseline only shrinks: neither a pull request nor a push to master may add entries to it.
      - name: Baselines do not grow (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/ci/check_baselines_shrink.sh "origin/$BASE_REF"

      - name: Baselines do not grow (push)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # After a force push the commit that was there before is not in the clone any more.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            scripts/ci/check_baselines_shrink.sh "$BEFORE"
          else
            echo "::warning::$BEFORE is not in this clone (force push?); the baselines were not compared"
          fi

  desktop:
    name: Desktop tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          path: shinsoux
          persist-credentials: false

      - name: Check out official plugin fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aluo96078/shinsou_plugin
          ref: 0bbc4d7f2f571010ea2acec17de0ea90be144399
          path: shinsou_plugin
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # The merged line coverage may not fall below MERGED_LINE_COVERAGE_FLOOR (build-logic
      # QualityPlugin.kt); --continue still writes the report when the bound fails.
      - name: Desktop tests and coverage
        working-directory: shinsoux
        run: >-
          ./gradlew :build-logic:test desktopTest :composeApp:koverXmlReportDesktop :composeApp:koverVerifyDesktop
          --continue
          -PshinsouPluginRepository=../../shinsou_plugin
          -Pkotlin.native.enableKlibsCrossCompilation=false --stacktrace

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-test-reports
          path: |
            shinsoux/*/build/reports/tests/desktopTest
            shinsoux/composeApp/build/reports/kover
          if-no-files-found: ignore

  # macOS: the libsodium host library the crypto tests load does not load on the Linux runner
  # (see sandbox-android.yml), which fails each of them before it starts.
  android:
    name: Android unit tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        # NDK and CMake build sandbox-core's libshinsou_sandbox.so (ADR-0002 S2).
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Android unit tests
        run: ./gradlew testDebugUnitTest -Pkotlin.native.enableKlibsCrossCompilation=false --stacktrace

  # C6 (0007): the Swift layer. Only the pure logic in iosApp/Shinsou/Logic is unit-tested: it is
  # compiled into the test bundle, so no ShinsouKit framework (and no Gradle build) is needed.
  swift:
    name: Swift (SwiftLint, XCTest, macOS helper)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The portable release, pinned by its checksum, so a new SwiftLint rule cannot fail a change.
      - name: SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          test "$("$RUNNER_TEMP/swiftlint/swiftlint" version)" = "$SWIFTLINT_VERSION"
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --config .swiftlint.yml

      # The WKWebView helper is one top-level script built by swiftc (NativeLibrariesPlugin.kt).
      - name: macOS helper compiles
        run: xcrun --sdk macosx swiftc -swift-version 5 -typecheck composeApp/src/desktopMain/swift/ShinsouWebChallenge/main.swift

      - name: XcodeGen
        run: brew install xcodegen

      - name: XCTest
        working-directory: iosApp
        run: |
          xcodegen generate
          device=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          xcodebuild test -project Shinsou.xcodeproj -scheme ShinsouTests \
            -destination "platform=iOS Simulator,id=$device"
